server:
  port: 8080
  # Detras de nginx (TLS) se respetan las cabeceras X-Forwarded-*
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: atlas-api

  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo controla Flyway (NFR-DIS-2: migraciones versionadas)
      ddl-auto: none
    show-sql: false

  flyway:
    # db/seed agrega datos SINTETICOS para QA; el perfil prod lo excluye
    locations: classpath:db/migration,classpath:db/seed

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

atlas:
  jwt:
    # Secreto HMAC en Base64 (>= 256 bits). En QA/prod SIEMPRE por variable de entorno.
    secret: ${ATLAS_JWT_SECRET:ZGV2LXNvbG8tcGFyYS1kZXNhcnJvbGxvLWNhbWJpYXItZW4tcWEtMzJieXRlcyEh}
    access-minutos: 15
    refresh-dias: 7
  cookie:
    secure: ${ATLAS_COOKIE_SECURE:true}
  login:
    max-intentos-fallidos: 5
    ventana-segundos: 60
  password:
    largo-minimo: 12
  storage:
    dir: ${ATLAS_STORAGE_DIR:./data/storage}
  documentos:
    max-bytes: 10485760
  contratos:
    dias-aviso-vencimiento: 30
  cors:
    origenes: ${ATLAS_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    cl.crealab.atlas: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    locations: classpath:db/migration
